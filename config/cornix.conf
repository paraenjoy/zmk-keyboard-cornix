# Cornix 전력 설정 (왼쪽·오른쪽 공통)

# 딥 슬립: 1시간 동안 입력이 없으면 잠듦. 키를 누르면 깨어나고, 깨우는 키는 입력되지 않음.
# USB가 연결돼 있는 동안에는 잠들지 않음.
# 노트북 절전(최대 30분)보다 조금 길게: 30~60분 휴식 뒤 깨우는 불편보다 회당 ~0.25mAh 절약이 작다고 판단.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# DCDC는 cornix.overlay에서 켬

# 송신 출력: 보드 기본값 +8dBm -> 0dBm (Zephyr 기본값, 오른쪽 반쪽은 원래 이 값)
# 책상 위 50cm 거리 기준. 연결이 끊기거나 입력이 밀리면 0 대신 PLUS_4로 올릴 것.
CONFIG_BT_CTLR_TX_PWR_0=y

# 배터리 경고 (표시등): 표시 잔량이 10% 이하에서 1% 바뀔 때마다 빨갛게 깜빡임 (모듈 기본값 5%)
# ZMK 표시 10% ≈ 3.53V ≈ 실제 남은 용량 2~4%. 왼쪽 기준 하루 넘는 여유를 두려고 10으로 올림.
# 실사용 소모량을 battery-history로 확인한 뒤 7이나 5로 내릴지 다시 판단할 것.
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
